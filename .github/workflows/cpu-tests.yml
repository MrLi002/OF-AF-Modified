name: CPU regression tests
on:
  push:
    branches: [fix/ofaf-reproducibility-20261030]
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/cpu-tests.yml"
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check syntax without CUDA or datasets
        run: python -m compileall -q models datasets util train_model.py bsergb_eval.py check_events.py check_ckpt.py tests
      - name: Install CPU dependencies
        run: |
          python -m pip install -U pip
          pip install numpy pillow pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run regression tests
        run: python -m pytest -q tests/test_ofaf_fixes.py
